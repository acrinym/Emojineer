name: Train 17 Diagnostic UTF-16 Publication Qualification

'on':
  push:
    branches:
      - train-17-language-server
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact integrated Train 17 lineage
        run: git merge-base --is-ancestor 901435537b9257a19570f0228f7c7d8fa6adabc2 HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply canonical diagnostic publication repair
        run: python3 .github/scripts/train17_publish_diagnostic_utf16_fix.py
      - name: Verify patch
        run: git diff --check
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit qualified product repair if needed
        run: |
          if git diff --quiet -- src/lsp.cpp tests/lsp_tests.cpp; then
            echo "No product repair delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lsp.cpp tests/lsp_tests.cpp
          git commit -m "Train 17: preserve canonical UTF-16 diagnostic ranges"
          git push origin HEAD:train-17-language-server
