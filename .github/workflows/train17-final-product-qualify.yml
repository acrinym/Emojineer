name: Train 17 Final Product Qualification

'on':
  push:
    branches:
      - train-17-language-server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final product lineage
        run: git merge-base --is-ancestor 3425d9d8512af3fd35dc4ab31fba6f4977be8578 HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Verify clean tree
        run: |
          git diff --check
          git status --short
