name: Train 17 Final Product Qualification

'on':
  push:
    branches:
      - train-17-language-server
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final product lineage
        run: git merge-base --is-ancestor 3425d9d8512af3fd35dc4ab31fba6f4977be8578 HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply JSON-RPC null-id contract repair
        run: python3 .github/scripts/train17_jsonrpc_null_id_fix.py
      - name: Verify patch
        run: git diff --check
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit qualified product repair if needed
        run: |
          if git diff --quiet -- src/lsp.cpp tests/lsp_tests.cpp; then
            echo "No product repair delta remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lsp.cpp tests/lsp_tests.cpp
          git commit -m "Train 17: emit explicit JSON-RPC null ids"
          git push origin HEAD:train-17-language-server
