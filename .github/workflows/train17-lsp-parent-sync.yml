name: Train 17 LSP Combined Qualification

'on':
  push:
    branches:
      - train-17-lsp-semantics-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repaired parent ancestry
        run: git merge-base --is-ancestor fb992e03733ac757fe4f3f102b899ab1b5193877 HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Record exact head
        run: echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
