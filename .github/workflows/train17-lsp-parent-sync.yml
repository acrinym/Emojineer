name: Train 17 LSP Position and Symbol Repair

'on':
  push:
    branches:
      - train-17-lsp-semantics-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repaired parent ancestry
        run: git merge-base --is-ancestor fb992e03733ac757fe4f3f102b899ab1b5193877 HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply exact position and symbol repair
        run: python3 .github/scripts/train17_lsp_position_symbol_repair.py
      - name: Apply semantic authority and acceptance repair
        run: python3 .github/scripts/train17_lsp_authority_repair.py
      - name: Verify patch
        run: git diff --check
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit qualified repair if needed
        run: |
          if git diff --quiet -- src/lsp.cpp tests/lsp_tests.cpp; then
            echo "No generated LSP repair delta remains on this head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lsp.cpp tests/lsp_tests.cpp
          git commit -m "Train 17 LSP: prove exact package authority semantics"
          git push origin HEAD:train-17-lsp-semantics-repair
