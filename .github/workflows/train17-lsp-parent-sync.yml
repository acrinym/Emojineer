name: Train 17 LSP Diagnostic Reconciliation

'on':
  push:
    branches:
      - train-17-lsp-semantics-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repaired parent ancestry
        run: git merge-base --is-ancestor fb992e03733ac757fe4f3f102b899ab1b5193877 HEAD
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply typed diagnostic reconciliation
        run: python3 .github/scripts/train17_lsp_diagnostic_reconcile.py
      - name: Verify patch
        run: git diff --check
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit qualified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/emojineer/lsp.hpp src/lsp.cpp
          git commit -m "Train 17 LSP: reconcile typed diagnostics"
          git push origin HEAD:train-17-lsp-semantics-repair
