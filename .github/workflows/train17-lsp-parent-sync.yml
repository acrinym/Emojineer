name: Train 17 LSP Parent Integration

'on':
  push:
    branches:
      - train-17-lsp-semantics-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-parent:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: train-17-lsp-semantics-repair
      - name: Merge exact repaired Train 17 parent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin train-17-language-server
          test "$(git rev-parse origin/train-17-language-server)" = "fb992e03733ac757fe4f3f102b899ab1b5193877"
          set +e
          git merge --no-edit origin/train-17-language-server
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected=$'include/emojineer/lsp.hpp\nsrc/lsp.cpp\ntests/lsp_tests.cpp'
            test "$conflicts" = "$expected"
            git checkout --ours -- include/emojineer/lsp.hpp src/lsp.cpp tests/lsp_tests.cpp
            git add include/emojineer/lsp.hpp src/lsp.cpp tests/lsp_tests.cpp
            git commit --no-edit
          fi
          git merge-base --is-ancestor fb992e03733ac757fe4f3f102b899ab1b5193877 HEAD
          git push origin HEAD:train-17-lsp-semantics-repair
