name: Train 17 fresh review qualify

on:
  push:
    branches:
      - train-17-language-server
    paths:
      - .github/workflows/train17-fresh-review-qualify.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Train 17 head
        uses: actions/checkout@v4
        with:
          ref: train-17-language-server
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libicu-dev

      - name: Verify expected repair lineage
        run: |
          git merge-base --is-ancestor a668b63408cd96825a486486942ea7eabbde0fc3 HEAD
          test -f .github/scripts/train17-fresh-review-repair.py
          test -f .github/scripts/train17-release-test-repair.py

      - name: Apply fresh exact-head review repairs
        run: |
          python3 .github/scripts/train17-fresh-review-repair.py
          python3 .github/scripts/train17-release-test-repair.py

      - name: Patch hygiene
        run: git diff --check

      - name: Debug configure
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

      - name: Debug build
        run: cmake --build build-debug -j2

      - name: Debug full CTest
        run: ctest --test-dir build-debug --output-on-failure

      - name: Release configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

      - name: Release build
        run: cmake --build build-release -j2

      - name: Release full CTest
        run: ctest --test-dir build-release --output-on-failure

      - name: Commit qualified product repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lsp.cpp src/module.cpp tests/lsp_tests.cpp tests/module_tests.cpp
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "Train 17: close final exact-head review blockers"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:train-17-language-server
