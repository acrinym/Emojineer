name: Train 17 Package Exact-Head Final

'on':
  push:
    branches:
      - train-17-package-foundation-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Exact-head clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Record exact qualified head
        run: |
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
          git status --short
