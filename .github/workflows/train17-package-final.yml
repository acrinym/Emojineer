name: Train 17 Offline Sync Authority Repair

'on':
  push:
    branches:
      - train-17-package-foundation-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: train-17-package-foundation-repair
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply strict offline sync authority repair
        run: |
          python3 .github/scripts/train17_offline_sync_authority_repair.py
          python3 .github/scripts/train17_offline_sync_no_network_fix.py
          python3 .github/scripts/train17_offline_path_fixture_fix.py
      - name: Verify patch
        run: git diff --check
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit qualified product repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/project.cpp src/package.cpp tests/project_tests.cpp tests/acceptance_journey_tests.cpp
          git commit -m "Train 17: enforce strict authority during offline sync"
          git push origin HEAD:train-17-package-foundation-repair
