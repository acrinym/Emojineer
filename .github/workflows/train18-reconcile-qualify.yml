name: Train 18 Final Qualification

on:
  push:
    branches: [train-18-reconcile-main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libicu-dev libcurl4-openssl-dev
      - name: Complete debugger product
        run: python3 .github/scripts/train18_product_completion.py
      - name: Repair source hash validation
        run: python3 .github/scripts/train18_source_hash_validation_fix.py
      - name: Add serialized-bytecode test includes
        run: python3 .github/scripts/train18_product_test_include.py
      - name: Validate diff
        run: git diff --check
      - name: Configure Debug
        run: cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build Debug
        run: cmake --build build-debug
      - name: Run debugger target unbuffered
        run: stdbuf -o0 -e0 ./build-debug/emojineer_debugger_tests
      - name: Test Debug
        run: ctest --test-dir build-debug --output-on-failure
      - name: Configure Release
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build Release
        run: cmake --build build-release
      - name: Test Release
        run: ctest --test-dir build-release --output-on-failure
      - name: Commit qualified Train 18 product repairs
        run: |
          paths=(src/module.cpp src/bytecode.cpp include/emojineer/bytecode.hpp include/emojineer/debugger.hpp src/debugger.cpp tests/debugger_tests.cpp)
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No qualified Train 18 product diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Train 18: finish bytecode provenance and debugger diagnostics'
          git push origin HEAD:train-18-reconcile-main
