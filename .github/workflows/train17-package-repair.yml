name: Train 17 Strict Registry Lock Qualification

'on':
  push:
    branches:
      - train-17-package-foundation-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: train-17-package-foundation-repair
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply strict registry lock metadata repair
        run: python3 .github/scripts/train17_lock_metadata_hardening.py
      - name: Verify patch
        run: |
          git diff --check
          git status --short
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit qualified source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/project.cpp src/package.cpp tests/acceptance_journey_tests.cpp
          git commit -m "Train 17: enforce registry lock metadata authority"
          git push origin HEAD:train-17-package-foundation-repair
