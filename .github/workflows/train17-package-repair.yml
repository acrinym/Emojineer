name: Train 17 Package Repair Qualification

on:
  push:
    branches:
      - train-17-package-foundation-repair
      - train-17-language-server
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-package-foundation:
    if: github.ref == 'refs/heads/train-17-package-foundation-repair' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: train-17-package-foundation-repair
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Apply the four reviewed package repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{label}: expected one old occurrence, got {text.count(old)}")
                  p.write_text(text.replace(old, new, 1))
                  print(f"applied: {label}")
              elif new in text:
                  print(f"already applied: {label}")
              else:
                  raise SystemExit(f"{label}: neither old nor repaired form found")

          # compile_file must use the sovereign lock/store-aware graph in offline mode.
          replace_once(
              "src/module.cpp",
              '#include "emojineer/package.hpp"\n#include "emojineer/parser.hpp"',
              '#include "emojineer/package.hpp"\n#include "emojineer/parser.hpp"\n#include "emojineer/project.hpp"',
              "module project authority include")
          replace_once(
              "src/module.cpp",
              '''    std::optional<PackageGraph> package_graph;\n    if (std::filesystem::is_regular_file(root / "emojineer.toml")) {\n        package_graph = resolve_package_graph(root);\n    }''',
              '''    std::optional<PackageGraph> package_graph;\n    if (std::filesystem::is_regular_file(root / "emojineer.toml")) {\n        const auto manifest = load_project_manifest(root / "emojineer.toml");\n        package_graph = resolve_package_graph(root, manifest, package_store_root(root), true);\n    }''',
              "compile_file lock/store resolver")

          # Package hashes and artifact hashes must share one canonical manifest authority,
          # including registry metadata when registry dependencies are present.
          package_cpp = Path("src/package.cpp")
          text = package_cpp.read_text()
          old = 'canonical_manifest_text(manifest, false)'
          if old in text:
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"package content identity: expected 2 legacy calls, got {count}")
              text = text.replace(old, 'canonical_manifest_text(manifest)')
              package_cpp.write_text(text)
              print("applied: canonical package content identity includes registries")
          elif text.count('canonical_manifest_text(manifest)') >= 2:
              print("already applied: canonical package content identity includes registries")
          else:
              raise SystemExit("canonical package content identity authority not found")

          # Reject malformed/stale locks before offline registry traversal. A lock is required
          # up front when the root actually declares a registry dependency; path-only projects
          # remain usable without manufacturing a meaningless lock.
          old_lock = '''    if (offline || !store_root.empty()) {\n        auto lock_path = root / "emojineer.lock";\n        if (std::filesystem::exists(lock_path)) {\n            lock_storage = load_project_lock(lock_path);\n            lock = &lock_storage;\n            \n            // Use store root from lock if not explicitly provided\n            if (effective_store_root.empty()) {\n                effective_store_root = root / ".emojineer" / "packages";\n            }\n        }\n    }'''
          new_lock = '''    if (offline || !store_root.empty()) {\n        const auto lock_path = root / "emojineer.lock";\n        const bool root_has_registry_dependency = std::any_of(\n            root_manifest.dependencies.begin(), root_manifest.dependencies.end(),\n            [](const ProjectDependency& dependency) {\n                return dependency.kind == DependencyKind::Registry;\n            });\n\n        if (!std::filesystem::exists(lock_path)) {\n            if (offline && root_has_registry_dependency) {\n                throw std::runtime_error(\n                    "offline package resolution requires emojineer.lock for registry dependencies");\n            }\n        } else {\n            try {\n                lock_storage = load_project_lock(lock_path);\n            } catch (const std::exception& error) {\n                throw std::runtime_error(\n                    std::string("cannot load emojineer.lock for package resolution: ") + error.what());\n            }\n            if (is_lock_stale(root, root_manifest, lock_storage)) {\n                throw std::runtime_error("emojineer.lock is stale; run 'emji sync'");\n            }\n            lock = &lock_storage;\n\n            // Use the project-local materialized store unless the caller supplied one.\n            if (effective_store_root.empty()) {\n                effective_store_root = package_store_root(root);\n            }\n        }\n    }'''
          replace_once("src/package.cpp", old_lock, new_lock, "offline missing/malformed/stale lock gate")

          # Preserve and validate the complete canonical manifest in artifacts.
          artifact = Path("src/package_artifact.cpp")
          art_text = artifact.read_text()
          start = art_text.index("void validate_canonical_manifest(const PackageArtifact& artifact) {")
          end = art_text.index("std::vector<PackageArtifactFile> collect_owned_sources", start)
          old_func = art_text[start:end]
          new_func = r'''void validate_canonical_manifest(const PackageArtifact& artifact) {
    const auto prefix = metadata_prefix(artifact.name, artifact.version, artifact.entry);
    if (!artifact.manifest.starts_with(prefix)) {
        throw std::runtime_error("package artifact metadata does not match its canonical manifest");
    }

    std::string_view rest{artifact.manifest};
    rest.remove_prefix(prefix.size());
    if (rest.empty()) return;

    constexpr std::string_view registry_header = "\n[registries]\n";
    constexpr std::string_view dependency_header = "\n[dependencies]\n";
    std::set<std::string> registry_aliases;

    if (rest.starts_with(registry_header)) {
        rest.remove_prefix(registry_header.size());
        std::string previous_alias;
        while (!rest.empty() && !rest.starts_with(dependency_header)) {
            const auto newline = rest.find('\n');
            if (newline == std::string_view::npos) {
                throw std::runtime_error("package artifact manifest must end with a newline");
            }
            const auto line = rest.substr(0, newline);
            if (line.empty()) {
                throw std::runtime_error("package artifact manifest has an empty registries section");
            }
            rest.remove_prefix(newline + 1);

            const auto separator = line.find(" = \"");
            if (separator == std::string_view::npos || line.size() < separator + 5 || line.back() != '"') {
                throw std::runtime_error("package artifact registry manifest line is not canonical");
            }
            const std::string alias(line.substr(0, separator));
            const std::string endpoint(line.substr(separator + 4, line.size() - separator - 5));
            validate_name(alias);
            if (endpoint.empty()) {
                throw std::runtime_error("package artifact registry endpoint may not be empty");
            }
            (void)parse_registry_endpoint(endpoint);
            if (!registry_aliases.insert(alias).second ||
                (!previous_alias.empty() && alias <= previous_alias)) {
                throw std::runtime_error("package artifact registry manifest is not canonically ordered");
            }
            previous_alias = alias;
        }
        if (registry_aliases.empty()) {
            throw std::runtime_error("package artifact manifest has an empty registries section");
        }
        if (rest.empty()) return;
    }

    if (!rest.starts_with(dependency_header)) {
        throw std::runtime_error("package artifact manifest is not canonical");
    }
    rest.remove_prefix(dependency_header.size());
    if (rest.empty()) throw std::runtime_error("package artifact manifest has an empty dependencies section");

    std::string previous_name;
    std::set<std::string> names;
    while (!rest.empty()) {
        const auto newline = rest.find('\n');
        if (newline == std::string_view::npos) {
            throw std::runtime_error("package artifact manifest must end with a newline");
        }
        const auto line = rest.substr(0, newline);
        rest.remove_prefix(newline + 1);
        const auto separator = line.find(" = \"");
        if (separator == std::string_view::npos || line.size() < separator + 5 || line.back() != '"') {
            throw std::runtime_error("package artifact dependency manifest line is not canonical");
        }
        const std::string name(line.substr(0, separator));
        const std::string value(line.substr(separator + 4, line.size() - separator - 5));
        validate_name(name);

        if (value.rfind("registry:", 0) == 0) {
            const auto second_colon = value.find(':', 9);
            if (second_colon == std::string::npos || second_colon == 9 ||
                second_colon == value.size() - 1) {
                throw std::runtime_error("package artifact dependency '" + name +
                                         "' has invalid registry format");
            }
            const std::string alias = value.substr(9, second_colon - 9);
            if (!registry_aliases.contains(alias)) {
                throw std::runtime_error("package artifact dependency '" + name +
                                         "' references undeclared registry '" + alias + "'");
            }
        } else {
            validate_dependency_path(value, name);
        }

        if (name == artifact.name) throw std::runtime_error("package artifact may not depend on itself");
        if (!names.insert(name).second || (!previous_name.empty() && name <= previous_name)) {
            throw std::runtime_error("package artifact dependency manifest is not canonically ordered");
        }
        previous_name = name;
    }
}

'''
          if "registry_aliases" not in old_func:
              art_text = art_text[:start] + new_func + art_text[end:]
              artifact.write_text(art_text)
              print("applied: canonical artifact registries validator")
          else:
              print("already applied: canonical artifact registries validator")

          replace_once(
              "src/package_artifact.cpp",
              'const auto canonical_manifest = canonical_manifest_text(manifest, false);',
              'const auto canonical_manifest = canonical_manifest_text(manifest);',
              "artifact manifest preserves registries")

          # Replace the false-positive publication test with a real transitive/offline journey.
          tests = Path("tests/acceptance_journey_tests.cpp")
          test_text = tests.read_text()
          begin = test_text.index("// Test 2: Create and publish a second library that depends on the first")
          finish = test_text.index("// Test 3: Initialize an application and add remote dependency", begin)
          existing = test_text[begin:finish]
          replacement = r'''// Test 2: Registry dependencies survive publication/materialization and remain sovereign offline
void test_publish_library_with_dependency() {
    std::cout << "Test: registry dependency artifact round-trip and offline ownership...\n";

    const auto registry_root = temp_root("registry-dep");
    std::filesystem::create_directories(registry_root);
    emojineer::initialize_file_registry(registry_root, "emojineer.test");
    const auto endpoint = emojineer::parse_registry_endpoint(registry_root.string());

    // lib-a exports a real Emojineer variable.
    const auto lib_a_root = temp_root("lib-a");
    std::filesystem::create_directories(lib_a_root / "src");
    write_text(lib_a_root / "emojineer.toml",
        "[package]\n"
        "name = \"lib-a\"\n"
        "version = \"1.0.0\"\n"
        "entry = \"src/main.emoji\"\n");
    write_text(lib_a_root / "src/main.emoji",
        "🧩 🌊\n"
        "🐍 🌟 🔢 🟰 9\n"
        "📤 🌟\n");
    const auto published_a = emojineer::publish_package_to_registry(lib_a_root, endpoint);
    require(published_a.record.version == "1.0.0", "lib-a publication must succeed");

    // lib-b directly imports lib-a through a registry dependency and exports a function.
    const auto lib_b_root = temp_root("lib-b");
    std::filesystem::create_directories(lib_b_root / "src");
    write_text(lib_b_root / "emojineer.toml",
        "[package]\n"
        "name = \"lib-b\"\n"
        "version = \"1.0.0\"\n"
        "entry = \"src/main.emoji\"\n"
        "\n[registries]\n"
        "origin = \"" + registry_root.string() + "\"\n"
        "\n[dependencies]\n"
        "lib-a = \"registry:origin:^1.0.0\"\n");
    write_text(lib_b_root / "src/main.emoji",
        "🧩 🌲\n"
        "🔗 📜pkg:lib-a/src/main.emoji📜\n"
        "🛠️ 🍏 🫴 🤲\n"
        "📦 🌟\n"
        "🏁\n"
        "📤 🍏\n");

    const auto artifact = emojineer::parse_package_artifact(
        emojineer::build_package_artifact_bytes(lib_b_root));
    require(artifact.manifest.find("[registries]") != std::string::npos,
            "registry package artifact must preserve [registries]");
    require(artifact.manifest.find("lib-a = \"registry:origin:^1.0.0\"") != std::string::npos,
            "registry dependency coordinate must round-trip in the artifact");

    const auto published_b = emojineer::publish_package_to_registry(lib_b_root, endpoint);
    require(published_b.record.version == "1.0.0", "lib-b publication must succeed");
    const auto b_index = emojineer::load_registry_package_index(endpoint, "lib-b");
    require(!b_index.versions.empty(), "published lib-b must be discoverable");

    // Root declares only lib-b. Online sync materializes lib-b and its transitive lib-a.
    const auto app_root = temp_root("app-registry-chain");
    emojineer::initialize_project(app_root, "app");
    emojineer::add_project_registry_dependency(
        app_root, "lib-b", "^1.0.0", registry_root.string(), "origin");
    emojineer::sync_project(app_root, false);

    const auto app_manifest = emojineer::load_project_manifest(app_root / "emojineer.toml");
    const auto app_lock = emojineer::load_project_lock(app_root / "emojineer.lock");
    require(!emojineer::is_lock_stale(app_root, app_manifest, app_lock),
            "freshly synced registry lock must not be stale");
    require(app_lock.registries.size() == 1 && app_lock.registries.front().alias == "origin",
            "lock must retain the concrete registry authority");

    bool saw_b = false;
    bool saw_a = false;
    for (const auto& dep : app_lock.dependencies) {
        if (dep.name == "lib-b") {
            saw_b = dep.source == emojineer::LockSourceKind::Registry && dep.store_path.has_value();
        } else if (dep.name == "lib-a") {
            saw_a = dep.source == emojineer::LockSourceKind::Registry && dep.store_path.has_value();
        }
    }
    require(saw_b && saw_a, "lock must materialize direct lib-b and transitive lib-a as registry packages");

    const auto offline_graph = emojineer::resolve_package_graph(
        app_root, app_manifest, emojineer::package_store_root(app_root), true);
    require(offline_graph.find("lib-b") != nullptr && offline_graph.find("lib-a") != nullptr,
            "offline graph must contain the direct package and its owned transitive");

    // Registry disappears. Ordinary compile must remain fully local and allow the declared direct.
    std::filesystem::remove_all(registry_root);
    write_text(app_root / "src/main.emoji",
        "🧩 🚀\n"
        "🔗 📜pkg:lib-b/src/main.emoji📜\n"
        "📝 🍏 🫴 🤲\n");
    (void)emojineer::compile_file(app_root / "src/main.emoji", {}, app_root);

    // The graph may contain lib-a for lib-b's use, but root must never gain ambient ownership.
    write_text(app_root / "src/main.emoji",
        "🧩 🚀\n"
        "🔗 📜pkg:lib-a/src/main.emoji📜\n");
    bool transitive_rejected = false;
    try {
        (void)emojineer::compile_file(app_root / "src/main.emoji", {}, app_root);
    } catch (const std::runtime_error& error) {
        transitive_rejected = std::string(error.what()).find(
            "does not declare direct dependency 'lib-a'") != std::string::npos;
    }
    require(transitive_rejected,
            "root must reject ambient transitive lib-a with the direct-ownership diagnostic");

    std::filesystem::remove_all(lib_a_root);
    std::filesystem::remove_all(lib_b_root);
    std::filesystem::remove_all(app_root);

    std::cout << "  ✅ Registry artifact, offline direct dependency, and transitive ownership proven\n";
}

'''
          if "Registry dependencies survive publication/materialization" not in existing:
              tests.write_text(test_text[:begin] + replacement + test_text[finish:])
              print("applied: real registry dependency acceptance journey")
          else:
              print("already applied: real registry dependency acceptance journey")
          PY

          git diff --check
          git diff -- src/module.cpp src/package.cpp src/package_artifact.cpp tests/acceptance_journey_tests.cpp
      - name: Build and test repaired tree before commit
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/module.cpp src/package.cpp src/package_artifact.cpp tests/acceptance_journey_tests.cpp
          git commit -m "Train 17 package repair: close offline artifact blockers"
          git push origin HEAD:train-17-package-foundation-repair

  qualify-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev
      - name: Clean configure, build, and full CTest
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Record exact qualified head
        run: |
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
          git status --short
